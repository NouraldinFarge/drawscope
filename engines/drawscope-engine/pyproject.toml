[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "drawscope-engine"
version = "0.6.2"
description = "Constrained analytics sidecar for DrawScope"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
drawscope-engine = "drawscope_engine.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pyinstaller>=6.15,<7",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/drawscope_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["drawscope_engine"]
mypy_path = "src"
