name: Feature request
description: Propose a bounded research or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the research or workflow problem, not a prediction claim.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the user workflow and the smallest useful scope.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or acceptance criteria
      description: What observable result would show that this improvement works without overstating its value?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Desktop UX and accessibility
        - Archive exploration
        - Data provenance or import review
        - Historical methodology
        - Packaging or release verification
        - Documentation
        - Other bounded improvement
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Responsible-use boundary
      options:
        - label: This request does not claim to predict future lottery outcomes.
          required: true
        - label: I reviewed the current methodology and known limitations.
          required: true
