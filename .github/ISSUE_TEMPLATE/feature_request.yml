name: Feature request
description: Propose a bounded research or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the research or workflow problem, not a prediction claim.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Responsible-use boundary
      options:
        - label: This request does not claim to predict future lottery outcomes.
          required: true

