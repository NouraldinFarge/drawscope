name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          download-from-astral-mirror: false
          enable-cache: true

      - name: Restore JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript and React
        run: pnpm verify

      - name: Verify archive freshness policy
        run: python tools/check_archive_freshness.py

      - name: Verify packaged analysis evidence
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          python tools/verify_analysis_evidence.py "examples/powerball-retrospective-v$version/analysis-evidence.json"

      - name: Verify PowerShell release scripts parse
        shell: pwsh
        run: |
          foreach ($file in @('BUILD-LATEST.ps1', 'tools/Test-WindowsInstaller.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file contains PowerShell syntax errors: $($errors | Out-String)"
            }
          }

      - name: Restore Python environment
        working-directory: engines/drawscope-engine
        run: uv sync --frozen --all-groups

      - name: Rebuild the bundled offline archive for native checks
        run: >-
          uv run --project engines/drawscope-engine python
          tools/build_offline_database.py --frozen

      - name: Build the bundled analytics sidecar for native checks
        working-directory: engines/drawscope-engine
        run: >-
          uv run pyinstaller --noconfirm --clean --onefile
          --name drawscope-engine --distpath dist --workpath build
          --specpath build src/drawscope_engine/cli.py

      - name: Verify Rust formatting
        run: cargo fmt --all --check

      - name: Verify Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Verify Python
        working-directory: engines/drawscope-engine
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest

      - name: Verify Python maintenance tools
        run: >-
          uv run --project engines/drawscope-engine ruff check
          tools/check_archive_freshness.py
          tools/update_freshness_issue.py
          tools/verify_analysis_evidence.py
