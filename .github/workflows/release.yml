name: Reproducible Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish portable release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: project/workspace

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Build and verify portable package
        working-directory: project/workspace
        shell: pwsh
        run: ./BUILD-LATEST.ps1 -SkipPause -ReplaceExistingArchive

      - name: Prepare release assets and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archives = @(Get-ChildItem project/portable-builds -Filter 'DrawScope-*-windows-x64-portable.zip')
          if ($archives.Count -ne 1) { throw "Expected exactly one DrawScope archive; found $($archives.Count)." }
          $archive = $archives[0]
          Copy-Item -LiteralPath $archive.FullName -Destination release
          $copied = Join-Path (Resolve-Path release) $archive.Name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $copied).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -Encoding ascii -LiteralPath "$copied.sha256"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: project/workspace
          format: spdx-json
          output-file: release/drawscope-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false

      - name: Attest portable package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.zip

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          $notes = "project/workspace/docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file $notes --title "DrawScope $env:GITHUB_REF_NAME"
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "DrawScope $env:GITHUB_REF_NAME"
          }
