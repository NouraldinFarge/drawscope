<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">DrawScope repository preview</title>
  <desc id="description">A local-first Windows research workbench for reproducible lottery archives and leakage-resistant historical testing.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="30" x2="1210" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43a5ff"/>
      <stop offset="1" stop-color="#7766f6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#26c6a0"/>
      <stop offset="0.5" stop-color="#43a5ff"/>
      <stop offset="1" stop-color="#7766f6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1170" cy="40" r="270" fill="#4f46e5" opacity="0.08"/>
  <circle cx="70" cy="650" r="330" fill="#0ea5e9" opacity="0.06"/>
  <path d="M0 584H1280" stroke="url(#rule)" stroke-width="4"/>

  <g transform="translate(68 72)">
    <rect width="94" height="94" rx="23" fill="#151b2b"/>
    <circle cx="47" cy="47" r="31" fill="none" stroke="url(#brand)" stroke-width="8"/>
    <circle cx="47" cy="47" r="20" fill="#202a42"/>
    <rect x="32" y="47" width="7" height="17" rx="3.5" fill="#fff"/>
    <rect x="43" y="31" width="7" height="33" rx="3.5" fill="#fff"/>
    <rect x="54" y="40" width="7" height="24" rx="3.5" fill="#fff"/>
    <circle cx="73" cy="24" r="8" fill="#ea5a55" stroke="#151b2b" stroke-width="3"/>
  </g>

  <text x="184" y="132" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-2">DrawScope</text>
  <text x="70" y="245" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">See the record clearly.</text>
  <text x="70" y="294" fill="#9eacc2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Reproducible lottery-archive research without pretending</text>
  <text x="70" y="327" fill="#9eacc2" font-family="Segoe UI, Arial, sans-serif" font-size="22">that historical patterns predict the next draw.</text>

  <g transform="translate(70 390)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="168" height="48" rx="24" fill="#132b3b" stroke="#246d8f"/>
    <circle cx="24" cy="24" r="6" fill="#26c6a0"/>
    <text x="42" y="31" fill="#dffaf3" font-size="17" font-weight="600">Local-first</text>
    <rect x="182" width="210" height="48" rx="24" fill="#18243c" stroke="#31558a"/>
    <circle cx="206" cy="24" r="6" fill="#43a5ff"/>
    <text x="224" y="31" fill="#e2edff" font-size="17" font-weight="600">Leakage-resistant</text>
    <rect x="406" width="178" height="48" rx="24" fill="#211e40" stroke="#51469b"/>
    <circle cx="430" cy="24" r="6" fill="#8b7bff"/>
    <text x="448" y="31" fill="#eeeaff" font-size="17" font-weight="600">Auditable</text>
  </g>

  <g transform="translate(760 70)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="450" height="424" rx="24" fill="#101827" stroke="#26354d"/>
    <text x="28" y="48" fill="#6db9ff" font-size="14" font-weight="700" letter-spacing="2.2">VERIFIED PROJECT SNAPSHOT</text>

    <rect x="28" y="80" width="188" height="132" rx="16" fill="#151f31" stroke="#2a3a55"/>
    <text x="48" y="116" fill="#8f9db4" font-size="14" font-weight="650">ARCHIVE</text>
    <text x="48" y="160" fill="#f8fafc" font-size="34" font-weight="750">41,598</text>
    <text x="48" y="186" fill="#9eacc2" font-size="15">deduplicated draws</text>

    <rect x="234" y="80" width="188" height="132" rx="16" fill="#151f31" stroke="#2a3a55"/>
    <text x="254" y="116" fill="#8f9db4" font-size="14" font-weight="650">RESEARCH</text>
    <text x="254" y="160" fill="#f8fafc" font-size="34" font-weight="750">30</text>
    <text x="254" y="186" fill="#9eacc2" font-size="15">fixed signals</text>

    <rect x="28" y="230" width="188" height="132" rx="16" fill="#151f31" stroke="#2a3a55"/>
    <text x="48" y="266" fill="#8f9db4" font-size="14" font-weight="650">EVALUATION</text>
    <text x="48" y="310" fill="#f8fafc" font-size="34" font-weight="750">250</text>
    <text x="48" y="336" fill="#9eacc2" font-size="15">walk-forward trials</text>

    <rect x="234" y="230" width="188" height="132" rx="16" fill="#151f31" stroke="#2a3a55"/>
    <text x="254" y="266" fill="#8f9db4" font-size="14" font-weight="650">STACK</text>
    <text x="254" y="304" fill="#f8fafc" font-size="19" font-weight="700">React · Rust</text>
    <text x="254" y="334" fill="#f8fafc" font-size="19" font-weight="700">Python · SQLite</text>
  </g>

  <text x="70" y="620" fill="#afbbcc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Windows research workbench · v0.6.5 · Methodology 1.3.0</text>
  <text x="1210" y="620" text-anchor="end" fill="#d8e3f3" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Evidence, not intuition.</text>
</svg>
