<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">DrawScope</title>
  <desc id="description">Local-first historical lottery research with reproducible data, leakage-resistant testing, and explicit responsible-use boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="40" x2="1510" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43a5ff"/>
      <stop offset="1" stop-color="#7766f6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#26c6a0"/>
      <stop offset="0.5" stop-color="#43a5ff"/>
      <stop offset="1" stop-color="#7766f6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="640" rx="32" fill="url(#background)"/>
  <circle cx="1410" cy="70" r="310" fill="#4f46e5" opacity="0.08"/>
  <circle cx="150" cy="620" r="360" fill="#0ea5e9" opacity="0.06"/>
  <path d="M0 566H1600" stroke="url(#rule)" stroke-width="4"/>

  <g transform="translate(92 84)" filter="url(#shadow)">
    <rect width="116" height="116" rx="28" fill="#151b2b"/>
    <circle cx="58" cy="58" r="38" fill="none" stroke="url(#brand)" stroke-width="9"/>
    <circle cx="58" cy="58" r="24" fill="#202a42"/>
    <rect x="39" y="58" width="9" height="20" rx="4.5" fill="#fff"/>
    <rect x="53" y="39" width="9" height="39" rx="4.5" fill="#fff"/>
    <rect x="67" y="49" width="9" height="29" rx="4.5" fill="#fff"/>
    <circle cx="90" cy="29" r="9" fill="#ea5a55" stroke="#151b2b" stroke-width="3"/>
  </g>

  <text x="242" y="137" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">DrawScope</text>
  <text x="96" y="258" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.2">See the record clearly.</text>
  <text x="96" y="313" fill="#9eacc2" font-family="Segoe UI, Arial, sans-serif" font-size="25">Reproducible lottery-archive research without pretending</text>
  <text x="96" y="349" fill="#9eacc2" font-family="Segoe UI, Arial, sans-serif" font-size="25">that historical patterns predict the next draw.</text>

  <g transform="translate(96 408)">
    <rect width="210" height="54" rx="27" fill="#132b3b" stroke="#246d8f"/>
    <circle cx="28" cy="27" r="7" fill="#26c6a0"/>
    <text x="48" y="35" fill="#dffaf3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Local-first</text>
    <rect x="226" width="252" height="54" rx="27" fill="#18243c" stroke="#31558a"/>
    <circle cx="254" cy="27" r="7" fill="#43a5ff"/>
    <text x="274" y="35" fill="#e2edff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Leakage-resistant</text>
    <rect x="494" width="222" height="54" rx="27" fill="#211e40" stroke="#51469b"/>
    <circle cx="522" cy="27" r="7" fill="#8b7bff"/>
    <text x="542" y="35" fill="#eeeaff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Auditable</text>
  </g>

  <g transform="translate(948 86)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="554" height="410" rx="24" fill="#101827" stroke="#26354d"/>
    <text x="34" y="52" fill="#6db9ff" font-size="16" font-weight="700" letter-spacing="2.4">VERIFIED PROJECT SNAPSHOT</text>

    <g transform="translate(34 82)">
      <rect width="233" height="126" rx="16" fill="#151f31" stroke="#2a3a55"/>
      <text x="22" y="38" fill="#8f9db4" font-size="15" font-weight="650" letter-spacing="1">ARCHIVE</text>
      <text x="22" y="82" fill="#f8fafc" font-size="36" font-weight="750">41,598</text>
      <text x="22" y="106" fill="#9eacc2" font-size="16">deduplicated draws</text>

      <rect x="253" width="233" height="126" rx="16" fill="#151f31" stroke="#2a3a55"/>
      <text x="275" y="38" fill="#8f9db4" font-size="15" font-weight="650" letter-spacing="1">RESEARCH</text>
      <text x="275" y="82" fill="#f8fafc" font-size="36" font-weight="750">30</text>
      <text x="275" y="106" fill="#9eacc2" font-size="16">fixed historical signals</text>

      <rect y="146" width="233" height="126" rx="16" fill="#151f31" stroke="#2a3a55"/>
      <text x="22" y="184" fill="#8f9db4" font-size="15" font-weight="650" letter-spacing="1">EVALUATION</text>
      <text x="22" y="228" fill="#f8fafc" font-size="36" font-weight="750">250</text>
      <text x="22" y="252" fill="#9eacc2" font-size="16">walk-forward trials</text>

      <rect x="253" y="146" width="233" height="126" rx="16" fill="#151f31" stroke="#2a3a55"/>
      <text x="275" y="184" fill="#8f9db4" font-size="15" font-weight="650" letter-spacing="1">STACK</text>
      <text x="275" y="222" fill="#f8fafc" font-size="22" font-weight="700">React · Rust</text>
      <text x="275" y="252" fill="#f8fafc" font-size="22" font-weight="700">Python · SQLite</text>
    </g>
  </g>

  <text x="96" y="610" fill="#afbbcc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Windows desktop research workbench · Version 0.6.5 · Methodology 1.3.0</text>
  <text x="1502" y="610" text-anchor="end" fill="#d8e3f3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Evidence, not intuition.</text>
</svg>
